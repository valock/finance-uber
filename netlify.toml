[build]
  # Site estático. O comando abaixo substitui o "Build command" antigo do painel do Netlify,
  # que ainda gerava config.js com a URL e a chave do Supabase (removido do app).
  command = "rm -f config.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control         = "public, max-age=0, must-revalidate"
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"

# O service worker precisa ser sempre buscado de novo para as atualizações chegarem
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
